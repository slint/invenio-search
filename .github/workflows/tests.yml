name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      paradedb:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv && uv pip install -e ".[tests]" flask
      - run: uv run pytest -q
        env:
          PARADEDB_DSN: postgresql://postgres:postgres@localhost:5432/postgres
